# bundle patch for the sysmon plugin: inserts its plugin row into the web
# profile roster. Applied as a profile bundle layer (the `dsh.bundle.patch`
# manifest field); install with
# `dsh plugin --profile web add link:<repo>/packages/sysmon`.
- insert:
    - id: ui-sysmon
      name: '@linxin666/dsh-client-ui-sysmon'
