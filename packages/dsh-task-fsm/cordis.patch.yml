# dsh-task-fsm bundle patch: inserts its plugin row into the web plugin roster.
# The bundle is the official dsh plugin shape — install it into a dsh profile
# (`dsh plugin --profile <name> add link:<repo>/packages/dsh-task-fsm`). The
# single row mounts BOTH halves: the host side (task-fsm-state.json store,
# transition routes, wake/ack/archive-plan routes) and the browser side (the
# `sidebar.session.row.leading` freeze mark + `sidebar.session.row.hover`
# queue tier / sub-reason lines), served from this package's lib/client.js.
- insert:
    - id: task-fsm
      name: 'dsh-task-fsm'
