# dsh-session-dispatch bundle patch: inserts the host-only dispatch route
# plugin into the web plugin roster. The bundle is the official dsh plugin
# shape — install it into a dsh profile
# (`dsh plugin --profile <name> add link:<repo>/packages/dsh-session-dispatch`).
# The single row mounts the host side only (POST /api/session-dispatch +
# GET /api/session-dispatch/health); the package declares no `dsh.client`
# face, so nothing appears in the browser roster.
- insert:
    - id: session-dispatch
      name: 'dsh-session-dispatch'
