# dsh-session-revive bundle patch: inserts the host-only revival policy
# plugin into the web plugin roster. The bundle is the official dsh plugin
# shape — install it into a dsh profile
# (`dsh plugin --profile <name> add link:<repo>/packages/dsh-session-revive`).
# The single row mounts the host side only (turn/end error detection and the
# loopback `GET /api/session-revive/status` evidence endpoint); the package
# declares no `dsh.client` face, so nothing appears in the browser roster.
- insert:
    - id: session-revive
      name: 'dsh-session-revive'
